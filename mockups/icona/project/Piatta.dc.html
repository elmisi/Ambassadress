<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Icona, versioni piatte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#F2F4F7}
</style>
</helmet>
<div style="width: 1440px; min-height: 2140px; box-sizing: border-box; padding: 64px 72px; display: flex; flex-direction: column; gap: 18px; background: #F2F4F7; color: #1B2233; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif">

  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs>
      <path id="p-blob" d="M1.008 -0.086 Q1.046 0.000 1.046 0.092 Q1.046 0.184 1.058 0.287 Q1.069 0.389 0.994 0.460 Q0.918 0.530 0.832 0.578 Q0.746 0.626 0.676 0.674 Q0.606 0.722 0.553 0.794 Q0.500 0.866 0.426 0.916 Q0.352 0.966 0.263 0.980 Q0.175 0.994 0.088 1.013 Q0.000 1.032 -0.089 1.021 Q-0.178 1.010 -0.254 0.957 Q-0.329 0.904 -0.420 0.894 Q-0.510 0.884 -0.605 0.858 Q-0.699 0.833 -0.737 0.742 Q-0.775 0.650 -0.825 0.578 Q-0.876 0.506 -0.933 0.433 Q-0.989 0.360 -0.994 0.268 Q-0.999 0.176 -0.977 0.088 Q-0.955 0.000 -0.959 -0.085 Q-0.962 -0.170 -0.947 -0.254 Q-0.932 -0.339 -0.890 -0.415 Q-0.848 -0.490 -0.822 -0.579 Q-0.795 -0.667 -0.774 -0.782 Q-0.752 -0.897 -0.654 -0.929 Q-0.555 -0.961 -0.445 -0.942 Q-0.336 -0.923 -0.254 -0.949 Q-0.172 -0.976 -0.086 -0.972 Q-0.000 -0.968 0.085 -0.964 Q0.169 -0.960 0.263 -0.970 Q0.357 -0.980 0.439 -0.942 Q0.522 -0.905 0.581 -0.834 Q0.640 -0.763 0.702 -0.702 Q0.765 -0.642 0.811 -0.568 Q0.856 -0.494 0.873 -0.409 Q0.890 -0.324 0.930 -0.247 Q0.970 -0.171 1.008 -0.086Z"></path>
      <path id="p-scallop" d="M1.055 0.000 L1.025 0.067 L0.964 0.127 L0.927 0.184 L0.939 0.252 L0.973 0.330 L0.975 0.404 L0.922 0.454 L0.842 0.486 L0.786 0.525 L0.772 0.592 L0.773 0.677 L0.746 0.746 L0.677 0.773 L0.592 0.772 L0.525 0.786 L0.486 0.842 L0.454 0.922 L0.404 0.975 L0.330 0.973 L0.252 0.939 L0.184 0.927 L0.127 0.964 L0.067 1.025 L0.000 1.055 L-0.067 1.025 L-0.127 0.964 L-0.184 0.927 L-0.252 0.939 L-0.330 0.973 L-0.404 0.975 L-0.454 0.922 L-0.486 0.842 L-0.525 0.786 L-0.592 0.772 L-0.677 0.773 L-0.746 0.746 L-0.773 0.677 L-0.772 0.592 L-0.786 0.525 L-0.842 0.486 L-0.922 0.454 L-0.975 0.404 L-0.973 0.330 L-0.939 0.252 L-0.927 0.184 L-0.964 0.127 L-1.025 0.067 L-1.055 0.000 L-1.025 -0.067 L-0.964 -0.127 L-0.927 -0.184 L-0.939 -0.252 L-0.973 -0.330 L-0.975 -0.404 L-0.922 -0.454 L-0.842 -0.486 L-0.786 -0.525 L-0.772 -0.592 L-0.773 -0.677 L-0.746 -0.746 L-0.677 -0.773 L-0.592 -0.772 L-0.525 -0.786 L-0.486 -0.842 L-0.454 -0.922 L-0.404 -0.975 L-0.330 -0.973 L-0.252 -0.939 L-0.184 -0.927 L-0.127 -0.964 L-0.067 -1.025 L-0.000 -1.055 L0.067 -1.025 L0.127 -0.964 L0.184 -0.927 L0.252 -0.939 L0.330 -0.973 L0.404 -0.975 L0.454 -0.922 L0.486 -0.842 L0.525 -0.786 L0.592 -0.772 L0.677 -0.773 L0.746 -0.746 L0.773 -0.677 L0.772 -0.592 L0.786 -0.525 L0.842 -0.486 L0.922 -0.454 L0.975 -0.404 L0.973 -0.330 L0.939 -0.252 L0.927 -0.184 L0.964 -0.127 L1.025 -0.067Z"></path>

      <!-- la A scavata nel sigillo: si vede il fondo attraverso -->
      <mask id="m-a" maskContentUnits="userSpaceOnUse" x="-2" y="-2" width="4" height="4" maskUnits="userSpaceOnUse">
        <rect x="-2" y="-2" width="4" height="4" fill="#FFFFFF"></rect>
        <path d="M-0.3 0.4 L0 -0.42 L0.3 0.4 M-0.18 0.13 H0.18" fill="none" stroke="#000000" stroke-width="0.17" stroke-linecap="round" stroke-linejoin="round"></path>
      </mask>

      <!-- sigillo pieno, A scavata -->
      <symbol id="s-cut" viewBox="-1.15 -1.15 2.3 2.3">
        <use href="#p-blob" fill="#B3263E" mask="url(#m-a)"></use>
      </symbol>
      <!-- sigillo a due toni: anello e A in rosso scuro -->
      <symbol id="s-ring" viewBox="-1.15 -1.15 2.3 2.3">
        <use href="#p-blob" fill="#B3263E"></use>
        <circle r="0.66" fill="none" stroke="#7E1428" stroke-width="0.08"></circle>
        <path d="M-0.27 0.34 L0 -0.36 L0.27 0.34 M-0.16 0.11 H0.16" fill="none" stroke="#7E1428" stroke-width="0.14" stroke-linecap="round" stroke-linejoin="round"></path>
      </symbol>
      <!-- timbro regolare, A scavata -->
      <symbol id="s-stamp" viewBox="-1.15 -1.15 2.3 2.3">
        <use href="#p-scallop" fill="#B3263E" mask="url(#m-a)"></use>
      </symbol>

      <!-- B1: la lettera, piatta -->
      <symbol id="f-b1" viewBox="0 0 512 512">
        <rect x="80" y="128" width="352" height="256" rx="24" fill="#F4EBD8"></rect>
        <path d="M80 152 Q80 128 104 128 H408 Q432 128 432 152 L256 256 Z" fill="#E2D2AF"></path>
        <use href="#s-cut" x="176" y="176" width="160" height="160"></use>
      </symbol>
      <!-- B2: l'icona è la busta, il sigillo la chiude al centro -->
      <symbol id="f-b2" viewBox="0 0 512 512">
        <path d="M-20 60 L256 256 L532 60 M-20 452 L168 316 M532 452 L344 316" fill="none" stroke="currentColor" stroke-width="26" stroke-linejoin="round"></path>
        <use href="#s-cut" x="148" y="148" width="216" height="216"></use>
      </symbol>
      <!-- C1: sigillo pieno, A scavata -->
      <symbol id="f-c1" viewBox="0 0 512 512">
        <use href="#s-cut" x="66" y="66" width="380" height="380"></use>
      </symbol>
      <!-- C2: sigillo a due toni -->
      <symbol id="f-c2" viewBox="0 0 512 512">
        <use href="#s-ring" x="66" y="66" width="380" height="380"></use>
      </symbol>
      <!-- C3: timbro dal bordo regolare -->
      <symbol id="f-c3" viewBox="0 0 512 512">
        <use href="#s-stamp" x="66" y="66" width="380" height="380"></use>
      </symbol>
      <!-- D1: rotolo chiuso e legato, piatto -->
      <symbol id="f-d1" viewBox="0 0 512 512">
        <g transform="rotate(-30 256 256)">
          <rect x="56" y="200" width="400" height="112" rx="56" fill="#F4EBD8"></rect>
          <ellipse cx="432" cy="256" rx="24" ry="56" fill="#E2D2AF"></ellipse>
          <path d="M432 256 m-6 0 a6 13 0 1 1 12 0 a12 27 0 1 1 -24 0" fill="none" stroke="#C9B183" stroke-width="7" stroke-linecap="round"></path>
          <rect x="226" y="194" width="20" height="124" fill="#8A1730"></rect>
          <rect x="266" y="194" width="20" height="124" fill="#8A1730"></rect>
        </g>
        <path d="M232 300 L188 392 L222 380 L236 410 L266 312 Z M280 300 L324 392 L290 380 L276 410 L246 312 Z" fill="#8A1730"></path>
        <use href="#s-cut" x="176" y="176" width="160" height="160"></use>
      </symbol>
    </defs>
  </svg>

  <header style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
    <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 750; letter-spacing: -0.025em">Pergamena e ceralacca, piatte</h1>
    <p style="margin: 0; max-width: 72ch; font-size: 16px; line-height: 1.5; color: #465064">B, C e D senza volume né ombre: colori pieni, la A scavata nella ceralacca. Stessi fondi e stesse dimensioni della prima prova.</p>
  </header>

  <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
    <section style="display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; padding: 18px 0; border-top: 1px solid #E0E4EA">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 28px; font-weight: 800; color: #B3263E">{{r.key}}</span>
        <h2 style="margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700">{{r.name}}</h2>
      </div>
      <sc-for list="{{grounds}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; align-items: flex-end; gap: 22px; padding: 18px 22px; border-radius: 18px; background: #E6E9EF">
          <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
              <div style="width: {{s.px}}px; height: {{s.px}}px; border-radius: {{s.radius}}px; background: {{g.color}}; color: {{g.line}}; box-shadow: {{s.shadow}}; display: grid; place-items: center; overflow: hidden">
                <svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 512 512" role="img" aria-label="{{r.name}}, {{s.px}} pixel"><use href="{{r.href}}"></use></svg>
              </div>
              <span style="font-size: 12px; color: #687185">{{s.px}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2140}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['B1', 'La lettera, piatta', '#f-b1'],
      ['B2', 'L’icona è la busta, chiusa dal sigillo', '#f-b2'],
      ['C1', 'Sigillo pieno, A scavata', '#f-c1'],
      ['C2', 'Sigillo a due toni', '#f-c2'],
      ['C3', 'Timbro dal bordo regolare', '#f-c3'],
      ['D1', 'Rotolo chiuso e legato, piatto', '#f-d1']
    ].map((r) => ({ key: r[0], name: r[1], href: r[2] }));
    const sizes = [192, 64, 32, 16].map((px) => ({
      px: px,
      radius: Math.round(px * 0.225),
      shadow: 'inset 0 0 0 1px rgba(27,34,51,.08)'
    }));
    const grounds = [{ color: '#1B2233', line: '#3A4561' }, { color: '#F2F4F7', line: '#CBD2DC' }];
    return { rows: rows, sizes: sizes, grounds: grounds };
  }
}
</script>
</body>
</html>
