<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Icona, sigillo sul rotolo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&amp;display=swap">
<style>
body{margin:0;background:#F2F4F7}
</style>
</helmet>
<div style="width: 1440px; min-height: 2720px; box-sizing: border-box; padding: 64px 72px; display: flex; flex-direction: column; gap: 18px; background: #F2F4F7; color: #1B2233; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif">

  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs>
      <path id="r-scallop" d="M1.055 0.000 L1.025 0.067 L0.964 0.127 L0.927 0.184 L0.939 0.252 L0.973 0.330 L0.975 0.404 L0.922 0.454 L0.842 0.486 L0.786 0.525 L0.772 0.592 L0.773 0.677 L0.746 0.746 L0.677 0.773 L0.592 0.772 L0.525 0.786 L0.486 0.842 L0.454 0.922 L0.404 0.975 L0.330 0.973 L0.252 0.939 L0.184 0.927 L0.127 0.964 L0.067 1.025 L0.000 1.055 L-0.067 1.025 L-0.127 0.964 L-0.184 0.927 L-0.252 0.939 L-0.330 0.973 L-0.404 0.975 L-0.454 0.922 L-0.486 0.842 L-0.525 0.786 L-0.592 0.772 L-0.677 0.773 L-0.746 0.746 L-0.773 0.677 L-0.772 0.592 L-0.786 0.525 L-0.842 0.486 L-0.922 0.454 L-0.975 0.404 L-0.973 0.330 L-0.939 0.252 L-0.927 0.184 L-0.964 0.127 L-1.025 0.067 L-1.055 0.000 L-1.025 -0.067 L-0.964 -0.127 L-0.927 -0.184 L-0.939 -0.252 L-0.973 -0.330 L-0.975 -0.404 L-0.922 -0.454 L-0.842 -0.486 L-0.786 -0.525 L-0.772 -0.592 L-0.773 -0.677 L-0.746 -0.746 L-0.677 -0.773 L-0.592 -0.772 L-0.525 -0.786 L-0.486 -0.842 L-0.454 -0.922 L-0.404 -0.975 L-0.330 -0.973 L-0.252 -0.939 L-0.184 -0.927 L-0.127 -0.964 L-0.067 -1.025 L-0.000 -1.055 L0.067 -1.025 L0.127 -0.964 L0.184 -0.927 L0.252 -0.939 L0.330 -0.973 L0.404 -0.975 L0.454 -0.922 L0.486 -0.842 L0.525 -0.786 L0.592 -0.772 L0.677 -0.773 L0.746 -0.746 L0.773 -0.677 L0.772 -0.592 L0.786 -0.525 L0.842 -0.486 L0.922 -0.454 L0.975 -0.404 L0.973 -0.330 L0.939 -0.252 L0.927 -0.184 L0.964 -0.127 L1.025 -0.067Z"></path>
      <mask id="r-mask" maskContentUnits="userSpaceOnUse" x="-2" y="-2" width="4" height="4" maskUnits="userSpaceOnUse">
        <rect x="-2" y="-2" width="4" height="4" fill="#FFFFFF"></rect>
        <path d="M-0.3 0.4 L0 -0.42 L0.3 0.4 M-0.18 0.13 H0.18" fill="none" stroke="#000000" stroke-width="0.17" stroke-linecap="round" stroke-linejoin="round"></path>
      </mask>
      <!-- il timbro della C3: bordo regolare, A scavata -->
      <path id="r-blob" d="M1.008 -0.086 Q1.046 0.000 1.046 0.092 Q1.046 0.184 1.058 0.287 Q1.069 0.389 0.994 0.460 Q0.918 0.530 0.832 0.578 Q0.746 0.626 0.676 0.674 Q0.606 0.722 0.553 0.794 Q0.500 0.866 0.426 0.916 Q0.352 0.966 0.263 0.980 Q0.175 0.994 0.088 1.013 Q0.000 1.032 -0.089 1.021 Q-0.178 1.010 -0.254 0.957 Q-0.329 0.904 -0.420 0.894 Q-0.510 0.884 -0.605 0.858 Q-0.699 0.833 -0.737 0.742 Q-0.775 0.650 -0.825 0.578 Q-0.876 0.506 -0.933 0.433 Q-0.989 0.360 -0.994 0.268 Q-0.999 0.176 -0.977 0.088 Q-0.955 0.000 -0.959 -0.085 Q-0.962 -0.170 -0.947 -0.254 Q-0.932 -0.339 -0.890 -0.415 Q-0.848 -0.490 -0.822 -0.579 Q-0.795 -0.667 -0.774 -0.782 Q-0.752 -0.897 -0.654 -0.929 Q-0.555 -0.961 -0.445 -0.942 Q-0.336 -0.923 -0.254 -0.949 Q-0.172 -0.976 -0.086 -0.972 Q-0.000 -0.968 0.085 -0.964 Q0.169 -0.960 0.263 -0.970 Q0.357 -0.980 0.439 -0.942 Q0.522 -0.905 0.581 -0.834 Q0.640 -0.763 0.702 -0.702 Q0.765 -0.642 0.811 -0.568 Q0.856 -0.494 0.873 -0.409 Q0.890 -0.324 0.930 -0.247 Q0.970 -0.171 1.008 -0.086Z"></path>
      <!-- la ceralacca della C1: bordo irregolare, A scavata -->
      <symbol id="r-wax" viewBox="-1.15 -1.15 2.3 2.3">
        <use href="#r-blob" fill="#B3263E" mask="url(#r-mask)"></use>
      </symbol>
      <symbol id="r-stamp" viewBox="-1.15 -1.15 2.3 2.3">
        <use href="#r-scallop" fill="#B3263E" mask="url(#r-mask)"></use>
      </symbol>

      <!-- G1: fascia bassa, un filo più larga del timbro -->
      <symbol id="g1" viewBox="0 0 512 512">
        <rect x="100" y="181" width="312" height="150" rx="8" fill="#ECDDBC"></rect>
      </symbol>
      <!-- G2: fascia più alta -->
      <symbol id="g2" viewBox="0 0 512 512">
        <rect x="100" y="151" width="312" height="210" rx="8" fill="#ECDDBC"></rect>
      </symbol>
      <!-- G3: fascia con i due rulli alle estremità -->
      <symbol id="g3" viewBox="0 0 512 512">
        <rect x="112" y="181" width="288" height="150" fill="#ECDDBC"></rect>
        <rect x="88" y="166" width="32" height="180" rx="16" fill="#D9C49B"></rect>
        <rect x="392" y="166" width="32" height="180" rx="16" fill="#D9C49B"></rect>
      </symbol>
      <!-- G4: rulli con la testa del cilindro, come un rotolo visto di fronte -->
      <symbol id="g4" viewBox="0 0 512 512">
        <rect x="112" y="181" width="288" height="150" fill="#ECDDBC"></rect>
        <rect x="86" y="160" width="36" height="192" rx="18" fill="#D9C49B"></rect>
        <rect x="390" y="160" width="36" height="192" rx="18" fill="#D9C49B"></rect>
        <ellipse cx="104" cy="176" rx="18" ry="8" fill="#BFA474"></ellipse>
        <ellipse cx="408" cy="176" rx="18" ry="8" fill="#BFA474"></ellipse>
      </symbol>
    </defs>
  </svg>

  <header style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
    <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 750; letter-spacing: -0.025em">Il sigillo sul rotolo</h1>
    <p style="margin: 0; max-width: 72ch; font-size: 16px; line-height: 1.5; color: #465064">Il sigillo su una fascia color pergamena, un filo più larga del sigillo. Le stesse quattro fasce con il timbro della C3 (G) e con la ceralacca della C1 (H): bassa, alta, con i due rulli, con la testa del cilindro.</p>
  </header>

  <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
    <section style="display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; padding: 18px 0; border-top: 1px solid #E0E4EA">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 28px; font-weight: 800; color: #B3263E">{{r.key}}</span>
        <h2 style="margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700">{{r.name}}</h2>
      </div>
      <sc-for list="{{grounds}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; align-items: flex-end; gap: 22px; padding: 18px 22px; border-radius: 18px; background: #E6E9EF">
          <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
              <div style="width: {{s.px}}px; height: {{s.px}}px; border-radius: {{s.radius}}px; background: {{g.color}}; box-shadow: inset 0 0 0 1px rgba(27,34,51,.08); display: grid; place-items: center; overflow: hidden">
                <svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 512 512" role="img" aria-label="{{r.name}}, {{s.px}} pixel"><use href="{{r.band}}"></use><use href="{{r.seal}}" x="106" y="106" width="300" height="300"></use></svg>
              </div>
              <span style="font-size: 12px; color: #687185">{{s.px}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2720}}'>
class Component extends DCLogic {
  renderVals() {
    const bands = [['1', 'fascia bassa', '#g1'], ['2', 'fascia alta', '#g2'], ['3', 'fascia con i rulli', '#g3'], ['4', 'rulli con la testa del cilindro', '#g4']];
    const seals = [['G', 'Timbro (C3)', '#r-stamp'], ['H', 'Ceralacca (C1)', '#r-wax']];
    const rows = [];
    seals.forEach((sl) => bands.forEach((b) => rows.push({ key: sl[0] + b[0], name: sl[1] + ', ' + b[1], band: b[2], seal: sl[2] })));
    const sizes = [192, 64, 32, 16].map((px) => ({ px: px, radius: Math.round(px * 0.225) }));
    const grounds = [{ color: '#1B2233' }, { color: '#F2F4F7' }];
    return { rows: rows, sizes: sizes, grounds: grounds };
  }
}
</script>
</body>
</html>
